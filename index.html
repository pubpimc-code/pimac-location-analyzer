<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피맥 출점 분석 시스템 v1.0</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        header{
            background:#222;
            color:white;
            padding:18px;
            font-size:24px;
            font-weight:bold;
            text-align:center;
        }

        #container{

            display:flex;
            height:calc(100vh - 70px);

        }

        #sidebar{

            width:320px;
            background:white;
            border-right:1px solid #ddd;
            padding:20px;
            overflow:auto;

        }

        #map{

            flex:1;

        }

        h2{

            margin-bottom:15px;

        }

        .brand{

            margin-bottom:10px;

        }

        input[type=checkbox]{

            transform:scale(1.2);

        }

        button{

            width:100%;
            padding:12px;
            margin-top:15px;
            background:#0078ff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;

        }

        button:hover{

            background:#005dd1;

        }

        #status{

            margin-top:20px;
            font-size:14px;
            color:#555;

        }

    </style>

</head>

<body>

<header>

🍕 피맥 출점 분석 시스템 v1.0

</header>

<div id="container">

    <div id="sidebar">

        <h2>브랜드 선택</h2>

        <div class="brand">

            <label>

                <input type="checkbox" checked>

                레코드피자

            </label>

        </div>

        <div class="brand">

            <label>

                <input type="checkbox" checked>

                피맥하우스

            </label>

        </div>

        <button>

            경쟁업체 불러오기

        </button>

        <button>

            Heat Map

        </button>

        <button>

            출점 추천

        </button>

        <div id="status">

            프로젝트 시작 준비 완료

        </div>

    </div>

    <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([37.5665,126.9780],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}).addTo(map);

</script>

</body>
</html>
